<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" font-family='system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif'>
<defs>
<marker id="ag" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#6f6b64"/></marker>
<marker id="ao" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#B85C38"/></marker>
<marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#c0392b"/></marker>
</defs>

<!-- GPU training job -->
<rect x="12" y="12" width="776" height="208" rx="10" fill="#faf8f4" stroke="#d9d4ca"/>
<text x="28" y="207" font-size="13.5" font-weight="600" fill="#2b2a27">GPU training job</text>

<rect x="40" y="48" width="160" height="54" rx="6" fill="#ffffff" stroke="#8a857b"/>
<text x="120" y="71" font-size="14" font-weight="600" fill="#2b2a27" text-anchor="middle">Learners</text>
<text x="120" y="90" font-size="12" fill="#6f6b64" text-anchor="middle">DPPO policy update</text>

<rect x="320" y="48" width="160" height="54" rx="6" fill="#ffffff" stroke="#8a857b"/>
<text x="400" y="71" font-size="14" font-weight="600" fill="#2b2a27" text-anchor="middle">vLLM engines</text>
<text x="400" y="90" font-size="12" fill="#6f6b64" text-anchor="middle">multi-turn agent loop</text>

<rect x="600" y="48" width="160" height="54" rx="6" fill="#ffffff" stroke="#8a857b"/>
<text x="680" y="71" font-size="14" font-weight="600" fill="#2b2a27" text-anchor="middle">Data prep</text>
<text x="680" y="90" font-size="12" fill="#6f6b64" text-anchor="middle">group advantages</text>

<rect x="320" y="148" width="160" height="54" rx="6" fill="#fdf1ea" stroke="#B85C38"/>
<text x="400" y="171" font-size="14" font-weight="600" fill="#2b2a27" text-anchor="middle">Environment pool</text>
<text x="400" y="190" font-size="12" fill="#6f6b64" text-anchor="middle">one sandbox per rollout</text>

<line x1="200" y1="75" x2="317" y2="75" stroke="#6f6b64" stroke-width="1.3" marker-end="url(#ag)"/>
<text x="259" y="67" font-size="12" fill="#6f6b64" text-anchor="middle">new weights</text>

<line x1="480" y1="75" x2="597" y2="75" stroke="#6f6b64" stroke-width="1.3" marker-end="url(#ag)"/>
<text x="539" y="54" font-size="12" fill="#6f6b64" text-anchor="middle">trajectory, reward,</text>
<text x="539" y="68" font-size="12" fill="#6f6b64" text-anchor="middle">infra-failure flag</text>

<path d="M680,48 V30 H120 V45" fill="none" stroke="#6f6b64" stroke-width="1.3" marker-end="url(#ag)"/>
<text x="400" y="25" font-size="12" fill="#6f6b64" text-anchor="middle">clean batches</text>

<line x1="385" y1="102" x2="385" y2="145" stroke="#6f6b64" stroke-width="1.3" marker-end="url(#ag)"/>
<text x="378" y="129" font-size="12" fill="#6f6b64" text-anchor="end">bash command</text>
<line x1="415" y1="148" x2="415" y2="105" stroke="#6f6b64" stroke-width="1.3" marker-end="url(#ag)"/>
<text x="422" y="129" font-size="12" fill="#6f6b64">observation</text>

<!-- Sandbox fleet -->
<rect x="12" y="252" width="776" height="256" rx="10" fill="#faf8f4" stroke="#d9d4ca"/>
<text x="28" y="275" font-size="13.5" font-weight="600" fill="#2b2a27">Sandbox fleet</text>
<text x="28" y="291" font-size="12" fill="#6f6b64">CPU nodes, on demand</text>

<!-- lease: pool <-> controller -->
<path d="M317,175 H240 V328 H203" fill="none" stroke="#6f6b64" stroke-width="1.3" marker-start="url(#ag)" marker-end="url(#ag)"/>
<text x="280" y="168" font-size="12" fill="#6f6b64" text-anchor="middle">lease</text>

<rect x="40" y="304" width="160" height="50" rx="6" fill="#ffffff" stroke="#8a857b"/>
<text x="120" y="325" font-size="14" font-weight="600" fill="#2b2a27" text-anchor="middle">Controller</text>
<text x="120" y="343" font-size="12" fill="#6f6b64" text-anchor="middle">leases and renewals</text>

<line x1="120" y1="354" x2="120" y2="377" stroke="#6f6b64" stroke-width="1.3" marker-end="url(#ag)"/>
<text x="128" y="371" font-size="12" fill="#6f6b64">scale up / down</text>

<rect x="40" y="380" width="160" height="50" rx="6" fill="#ffffff" stroke="#8a857b"/>
<text x="120" y="401" font-size="14" font-weight="600" fill="#2b2a27" text-anchor="middle">Slurm</text>
<text x="120" y="419" font-size="12" fill="#6f6b64" text-anchor="middle">CPU jobs</text>

<path d="M40,454 V492 A80,6 0 0 0 200,492 V454" fill="#ffffff" stroke="#8a857b"/>
<ellipse cx="120" cy="454" rx="80" ry="6" fill="#ffffff" stroke="#8a857b"/>
<text x="120" y="476" font-size="13.5" font-weight="600" fill="#2b2a27" text-anchor="middle">Task images</text>
<text x="120" y="491" font-size="11.5" fill="#6f6b64" text-anchor="middle">one prebuilt per task</text>

<line x1="200" y1="405" x2="257" y2="405" stroke="#6f6b64" stroke-width="1.3" marker-end="url(#ag)"/>
<text x="229" y="398" font-size="12" fill="#6f6b64" text-anchor="middle">start</text>
<line x1="200" y1="473" x2="257" y2="473" stroke="#6f6b64" stroke-width="1.3" marker-end="url(#ag)"/>
<text x="229" y="466" font-size="12" fill="#6f6b64" text-anchor="middle">image</text>

<!-- workers -->
<rect x="260" y="304" width="512" height="192" rx="8" fill="#f1eee7" stroke="#c9c4b9"/>
<text x="276" y="323" font-size="12.5" font-weight="600" fill="#6f6b64">CPU worker nodes</text>

<rect x="276" y="332" width="232" height="150" rx="6" fill="#ffffff" stroke="#8a857b"/>
<rect x="524" y="332" width="232" height="150" rx="6" fill="#ffffff" stroke="#8a857b"/>

<g font-size="12" text-anchor="middle">
<rect x="288" y="358" width="64" height="58" rx="5" fill="#fdf1ea" stroke="#B85C38"/>
<text x="320" y="383" font-weight="600" fill="#2b2a27">sandbox</text><text x="320" y="400" fill="#6f6b64">2 CPUs</text>
<rect x="360" y="358" width="64" height="58" rx="5" fill="#fdf1ea" stroke="#B85C38"/>
<text x="392" y="383" font-weight="600" fill="#2b2a27">sandbox</text><text x="392" y="400" fill="#6f6b64">2 CPUs</text>
<rect x="432" y="358" width="64" height="58" rx="5" fill="#fdf1ea" stroke="#B85C38"/>
<text x="464" y="383" font-weight="600" fill="#2b2a27">sandbox</text><text x="464" y="400" fill="#6f6b64">2 CPUs</text>
<rect x="536" y="358" width="64" height="58" rx="5" fill="#fdf1ea" stroke="#B85C38"/>
<text x="568" y="383" font-weight="600" fill="#2b2a27">sandbox</text><text x="568" y="400" fill="#6f6b64">2 CPUs</text>
<rect x="608" y="358" width="64" height="58" rx="5" fill="#fdf1ea" stroke="#B85C38"/>
<text x="640" y="383" font-weight="600" fill="#2b2a27">sandbox</text><text x="640" y="400" fill="#6f6b64">2 CPUs</text>
<rect x="680" y="358" width="64" height="58" rx="5" fill="#fbe7e4" stroke="#c0392b" stroke-dasharray="4 3"/>
<text x="712" y="383" font-weight="600" fill="#c0392b">lost</text><text x="712" y="400" font-size="11" fill="#c0392b">preempted</text>
</g>
<text x="392" y="446" font-size="11.5" fill="#6f6b64" text-anchor="middle">Apptainer: no root, no host env,</text>
<text x="392" y="462" font-size="11.5" fill="#6f6b64" text-anchor="middle">capped memory, disk, and output</text>
<text x="640" y="446" font-size="11.5" fill="#6f6b64" text-anchor="middle">hidden tests run here at the end</text>
<text x="640" y="462" font-size="11.5" fill="#6f6b64" text-anchor="middle">and write the reward</text>

<!-- direct command traffic -->
<line x1="400" y1="205" x2="400" y2="355" stroke="#B85C38" stroke-width="2" marker-start="url(#ao)" marker-end="url(#ao)"/>
<text x="408" y="233" font-size="12" font-weight="600" fill="#B85C38">commands, files, tests &#8644; output, reward</text>
<text x="408" y="247" font-size="11.5" fill="#B85C38">straight to the worker, not via the controller</text>

<!-- infra failure path -->
<line x1="712" y1="357" x2="712" y2="106" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ar)"/>
<text x="704" y="146" font-size="12" font-weight="600" fill="#c0392b" text-anchor="end">infrastructure failure:</text>
<text x="704" y="161" font-size="12" fill="#c0392b" text-anchor="end">masked, not scored as 0</text>
</svg>
